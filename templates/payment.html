{% extends "base.html" %}
{% block content %}

<style>
.payment-card {
    max-width: 550px;
    margin: 30px auto;
    background: #151522;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    padding: 25px;
}
.payment-title { color: #bd8aff; font-weight: 700; }
.form-control, .form-select {
    background: #222235;
    color: white;
    border: 1px solid #41415a;
}
.form-control:focus, .form-select:focus {
    background: #222235;
    color: white;
    border-color: #a855f7;
    box-shadow: none;
}
.btn-purple {
    background: #914bdc;
    color: white;
    border: none;
}
.btn-purple:hover { background: #7434b8; color: white; }
</style>

<div class="container py-3">

    <div class="payment-card">
        <h3 class="payment-title mb-4">💳 ТӨЛБӨРИЙН ХҮСЭЛТ</h3>

        {% if movie %}
            <div class="alert alert-info">
                🎬 Кино: <strong>{{ movie.title }}</strong>
            </div>
        {% else %}
            <div class="alert alert-warning">
                👑 1 сарын VIP эрх — 30 хоног
            </div>
        {% endif %}

        <form method="POST">

            <label class="form-label text-light">Төлбөрийн арга</label>
            <select class="form-select mb-3" name="method" required>
                <option value="QPay">QPay</option>
                <option value="Банкны шилжүүлэг">Банкны шилжүүлэг</option>
                <option value="Бусад">Бусад</option>
            </select>

            <label class="form-label text-light">Төлсөн дүн (₮)</label>
            <input class="form-control mb-3"
                   type="number"
                   name="amount"
                   min="1"
                   placeholder="Төлсөн дүнгээ оруулна уу"
                   required>

            <label class="form-label text-light">Гүйлгээний баримт / мэдээлэл</label>
            <textarea class="form-control mb-3"
                      name="proof"
                      rows="4"
                      placeholder="Гүйлгээний утга, баримтын холбоос эсвэл мэдээлэл"></textarea>

            <button type="submit" class="btn btn-purple w-100 py-2">
                Хүсэлт илгээх
            </button>
        </form>

        <a href="{{ url_for('index') }}" class="btn btn-outline-light w-100 mt-3">
            Буцах
        </a>
    </div>

</div>
{% endblock %}
